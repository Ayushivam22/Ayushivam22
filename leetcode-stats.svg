        .secondary-number {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            font-size: 45px;
            font-weight: 700;
        }

        .secondary-label {
            fill: #f0f6fc;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            font-size: 21px;
            font-weight: 500;
        }

        .secondary-description {
            fill: #8c9aad;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            font-size: 19px;
